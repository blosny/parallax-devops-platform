# Parallax DevOps Platform - Observability Helm Values
# Configured for kube-prometheus-stack deployment on Kubernetes / Minikube

global:
  namespace: monitoring
  environment: development

prometheus:
  enabled: true
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    scrapeInterval: "15s"
    evaluationInterval: "15s"
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

alertmanager:
  enabled: true
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'devops-slack-webhook'
      routes:
        - match:
            severity: critical
          receiver: 'devops-critical-channel'
          continue: true
        - match:
            severity: warning
          receiver: 'devops-slack-webhook'
    receivers:
      - name: 'devops-slack-webhook'
        webhook_configs:
          - url: 'http://argocd-notifications-controller.argocd.svc:9001/webhook'
            send_resolved: true
      - name: 'devops-critical-channel'
        webhook_configs:
          - url: 'http://argocd-notifications-controller.argocd.svc:9001/webhook/critical'
            send_resolved: true
    inhibit_rules:
      - source_match:
          alert: 'MicroserviceTargetDown'
        target_match:
          alert: 'HighRequestLatency'
        equal: ['service', 'namespace']

grafana:
  enabled: true
  adminPassword: "parallax-admin-2026"
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: k8s-sidecar-target-directory
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'parallax-provider'
          orgId: 1
          folder: 'Parallax Platform'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/parallax

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

