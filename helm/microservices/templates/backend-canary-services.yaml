{{- if and .Values.backend.rollout .Values.backend.rollout.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.rollout.strategy.canary.stableService | default "backend-stable" }}
  labels:
    app: {{ .Values.backend.name }}
    env: {{ .Values.global.environment }}
    role: stable
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.backend.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.rollout.strategy.canary.canaryService | default "backend-canary" }}
  labels:
    app: {{ .Values.backend.name }}
    env: {{ .Values.global.environment }}
    role: canary
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.backend.name }}
{{- end }}

