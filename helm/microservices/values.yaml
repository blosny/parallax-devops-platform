# Parallax DevOps Platform - Microservices Helm Values
global:
  environment: development
  imagePullPolicy: IfNotPresent

backend:
  name: backend
  replicaCount: 4
  image:
    repository: parallax-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  rollout:
    enabled: true
    strategy:
      canary:
        stableService: backend-stable
        canaryService: backend-canary
        steps:
          - setWeight: 20
          - pause: { duration: 30s }
          - setWeight: 50
          - pause: { duration: 30s }
          - setWeight: 100
        analysis:
          templates:
            - templateName: backend-success-rate
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

frontend:
  name: frontend
  replicaCount: 2
  image:
    repository: parallax-frontend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30080
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10

security:
  mtls:
    enabled: true
    mode: STRICT

gateway:
  ingressClass: kong
  rateLimiting:
    minute: 5
    policy: local
  apiKeyAuth:
    keyName: apikey
    consumer: parallax-developer
    secretKey: parallax-secret-key-2026

observability:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

