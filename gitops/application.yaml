apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parallax-microservices
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack-alerts: ""
spec:
  project: default
  source:
    repoURL: https://github.com/blosny/parallax-devops-platform.git
    targetRevision: main
    path: helm/microservices
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
