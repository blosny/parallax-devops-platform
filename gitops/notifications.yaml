apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
data:
  # Trigger rule: fire when an application sync fails or enters Error phase
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send:
        - app-sync-failed
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']

  # Message template formatted for Slack / Webhook
  template.app-sync-failed: |
    message: |
      🚨 [Parallax DevOps Alert] GitOps Sync Failure Detected!
      • Application: {{.app.metadata.name}}
      • Health Status: {{.app.status.health.status}}
      • Target Revision: {{.app.spec.source.targetRevision}}
      • Commit SHA: {{.app.status.sync.revision}}
      • Repository: {{.app.spec.source.repoURL}}
      • Failure Reason: {{.app.status.operationState.message}}
      • Timestamp: {{.app.status.operationState.finishedAt}}

  # Webhook / Slack integration service definition (referencing secret parameter)
  service.webhook.slack-alerts: |
    url: $slack-webhook-url
    headers:
      - name: Content-Type
        value: application/json
