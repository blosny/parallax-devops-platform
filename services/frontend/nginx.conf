pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths writable by unprivileged non-root USER 1001
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        # Non-privileged port for USER 1001 compliance
        listen 3000;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Mandatory Health Check Endpoint for Kubernetes & Week 1 contracts
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"frontend-service","timestamp":"$time_iso8601"}';
        }

        # Mandatory Service Info Endpoint for Kong Gateway & Service Mesh
        location /info {
            default_type application/json;
            return 200 '{"service":"frontend-service","version":"1.0.0","server":"Nginx Alpine","environment":"production"}';
        }

        # Main Single Page Dashboard
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
